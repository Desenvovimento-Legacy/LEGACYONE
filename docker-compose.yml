# Ambiente local de desenvolvimento do AIRES.
#
#   docker compose up -d                      Postgres + NATS (suficiente para a Fase 0)
#   docker compose --profile workflow up -d   + Temporal e Temporal UI (Fase 1)
#
# Depois: pnpm db:migrate && pnpm db:dev-roles
# Armazenamento de documentos (S3) entra na Fase 2, com imagem definida na época.

# Nome fixo do projeto: renomear a pasta não cria um banco novo vazio.
name: legacyone

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: legacy_owner
      POSTGRES_PASSWORD: legacy_owner_dev
      POSTGRES_DB: legacy_one
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy_owner -d legacy_one"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  temporal:
    image: temporalio/auto-setup:1.25
    profiles: ["workflow"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: legacy_owner
      POSTGRES_PWD: legacy_owner_dev
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["workflow"]
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

volumes:
  pgdata:
  natsdata:
