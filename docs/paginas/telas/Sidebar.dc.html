<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AIRES — Menu lateral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Menu principal" style="width: 260px; min-height: 100%; box-sizing: border-box; background: #0A1420; border-right: 1px solid #1E3247; padding: 20px 14px 24px; display: flex; flex-direction: column; gap: 18px; font-family: Manrope, system-ui, sans-serif; color: #C9D8E4">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
    <svg width="32" height="32" viewBox="0 0 30 30" fill="none" stroke="#3FC1B4" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="9" r="2.2"></circle><circle cx="21" cy="7" r="2.2"></circle><circle cx="15" cy="16" r="2.2"></circle><circle cx="23" cy="20" r="2.2"></circle><circle cx="9" cy="22" r="2.2"></circle><path d="M10 10l3.5 4.5M19.5 8.5L16 14M17 17l4.5 2M13.2 17.5L10.5 20.5M15 18.2V27"></path></svg>
    <div style="display: flex; flex-direction: column">
      <span style="font-weight: 800; font-size: 21px; letter-spacing: 0.1em; color: #FFFFFF">AIRES</span>
      <span style="font-size: 11px; color: #8FA5B8">Contabilidade Legacy</span>
    </div>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="padding: 0 10px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #6F8496">{{g.title}}</span>
      <sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
        <a href="{{i.href}}" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font-size: 13px; text-decoration: none; background: {{i.bg}}; color: {{i.fg}}; font-weight: {{i.weight}}">
          <span style="width: 7px; height: 7px; border-radius: 50%; flex: none; background: {{i.dot}}"></span>
          <span style="flex: 1; min-width: 0">{{i.label}}</span>
          <sc-if value="{{i.badge}}" hint-placeholder-val="{{ false }}"><span style="background: #E8A33D; color: #1B1206; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px">{{i.badge}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>

  <div style="margin-top: auto; padding: 12px; border-radius: 10px; background: #111F2E; border: 1px solid #1E3247; font-size: 12px; line-height: 1.5">
    <div style="color: #FFFFFF; font-weight: 700">Luan Sanchez</div>
    <div style="color: #8FA5B8">Gestor · aprova regras e transmissões</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["central","fechamento","fila","processos","empresas","receita","revisao","auditoria","regras","cofre"],"default":"central"},"$preview":{"width":260,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'central';
    // dot: verde = agente ativo, azul = em construção, cinza = planejado
    const D = { on: '#3FC1B4', build: '#4A9BE0', off: '#3A4F63' };
    const it = (id, label, href, dot, badge) => ({
      label, href, badge: badge || '',
      dot: D[dot],
      bg: id === active ? '#17293B' : 'transparent',
      fg: id === active ? '#FFFFFF' : '#C9D8E4',
      weight: id === active ? '700' : '500'
    });
    return {
      groups: [
        { title: 'OPERAÇÃO', items: [
          it('central', 'Central de agentes', 'Main.dc.html', 'on'),
          it('fechamento', 'Fechamento', 'Fechamento.dc.html', 'off'),
          it('fila', 'Fila humana', 'Main.dc.html', 'on', '2')
        ]},
        { title: 'PROCESSOS', items: [
          it('processos', 'Todos os processos', 'Processos.dc.html', 'on'),
          it('p-imp', 'Implantação', 'Processos.dc.html', 'on'),
          it('p-doc', 'Documentos', 'Processos.dc.html', 'build'),
          it('p-fis', 'Fiscal', 'Processos.dc.html', 'off'),
          it('p-fol', 'Folha', 'Processos.dc.html', 'off'),
          it('p-fin', 'Financeiro e conciliação', 'Processos.dc.html', 'off'),
          it('p-con', 'Contábil', 'Processos.dc.html', 'off'),
          it('p-tri', 'Tributos e guias', 'Processos.dc.html', 'off'),
          it('p-obr', 'Obrigações e SPED', 'Processos.dc.html', 'off'),
          it('p-tra', 'Transmissão', 'Processos.dc.html', 'off'),
          it('p-soc', 'Societário e contratos', 'Processos.dc.html', 'off'),
          it('p-reg', 'Regularização', 'Processos.dc.html', 'off'),
          it('p-rel', 'Relacionamento', 'Processos.dc.html', 'off')
        ]},
        { title: 'CLIENTES', items: [
          it('empresas', 'Empresas', 'Empresa.dc.html', 'on'),
          it('receita', 'Receita Federal', 'Receita.dc.html', 'on')
        ]},
        { title: 'CONTROLE', items: [
          it('revisao', 'Revisão independente', 'Processos.dc.html', 'off'),
          it('auditoria', 'Auditoria', 'Main.dc.html', 'on'),
          it('regras', 'Regras e legislação', 'Processos.dc.html', 'off'),
          it('cofre', 'Cofre e acessos', 'Main.dc.html', 'on')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
